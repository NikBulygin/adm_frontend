stages:
  - install
  - lint
  - typecheck

variables:
  PROJECT_NAME: frontend

.notify_start: &notify_start |
  MSG="project=${PROJECT_NAME} | branch=${CI_COMMIT_REF_NAME} | env=${ENVIRONMENT} | stage=${CI_JOB_STAGE} | status=STARTED | pipeline=${CI_PIPELINE_URL}"
  curl -sS -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" -d chat_id="${TG_GROUP_ID}" -d text="${MSG}" >/dev/null

.notify_end: &notify_end |
  STATUS="SUCCESS"
  if [ "${CI_JOB_STATUS}" != "success" ]; then STATUS="FAILED"; fi
  MSG="project=${PROJECT_NAME} | branch=${CI_COMMIT_REF_NAME} | env=${ENVIRONMENT} | stage=${CI_JOB_STAGE} | status=${STATUS} | pipeline=${CI_PIPELINE_URL}"
  curl -sS -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" -d chat_id="${TG_GROUP_ID}" -d text="${MSG}" >/dev/null

.prepare_env: &prepare_env |
  if [ "$CI_COMMIT_REF_NAME" = "main" ]; then export ENVIRONMENT=prod; else export ENVIRONMENT=dev; fi

install:
  stage: install
  image: node:22-alpine
  before_script:
    - *prepare_env
    - *notify_start
    - corepack enable
    - corepack prepare pnpm@latest --activate
  script:
    - pnpm install
  after_script:
    - *notify_end
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main"'

lint:
  stage: lint
  image: node:22-alpine
  before_script:
    - *prepare_env
    - *notify_start
    - corepack enable
    - corepack prepare pnpm@latest --activate
    - pnpm install
  script:
    - pnpm run lint
  after_script:
    - *notify_end
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main"'

typecheck:
  stage: typecheck
  image: node:22-alpine
  before_script:
    - *prepare_env
    - *notify_start
    - corepack enable
    - corepack prepare pnpm@latest --activate
    - pnpm install
  script:
    - pnpm run typecheck
  after_script:
    - *notify_end
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev" || $CI_COMMIT_BRANCH == "main"'
